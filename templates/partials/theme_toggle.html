{# Accessible segmented theme control for Light, Dark, and System #}
<div class="segs" role="group" aria-label="Theme">
  <button type="button" class="seg" data-theme-value="light" aria-pressed="false" aria-label="Light theme">Light</button>
  <button type="button" class="seg" data-theme-value="dark" aria-pressed="false" aria-label="Dark theme">Dark</button>
  <button type="button" class="seg on" data-theme-value="system" aria-pressed="true" aria-label="System theme">System</button>
</div>
