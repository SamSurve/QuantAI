{# Endpoint Settings Dialog matching Home.tsx:328 #}
<div id="endpoint-settings-dialog" role="dialog" aria-modal="true" aria-label="Research endpoint settings"
  style="display:none;position:fixed;inset:0;z-index:100;place-items:center;background:rgba(0,0,0,0.4);padding:16px;backdrop-filter:blur(4px)">
  <div style="width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,0.3);position:relative">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px">
      <div>
        <p class="ledger-label" style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin:0">
          Connection settings
        </p>
        <h2 style="margin:4px 0 0;font-size:20px;font-weight:700;color:var(--text)">Research Desk endpoint</h2>
      </div>
      <button id="endpoint-close-btn" type="button" aria-label="Close settings"
        style="background:0 0;border:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px">
        ✕
      </button>
    </div>

    <p class="muted" style="font-size:13px;line-height:1.5;margin:0 0 16px">
      Production uses the same-origin <code style="font-family:monospace;background:var(--fill);padding:2px 4px;border-radius:4px">/api</code> route. Local Vite development proxies this route to the local backend.
    </p>

    <label style="display:block;margin-bottom:20px">
      <span class="ledger-label" style="display:block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">
        Base URL
      </span>
      <input id="endpoint-url-input" type="text"
        placeholder="/api"
        style="width:100%;border:1px solid var(--line);background:var(--fill);color:var(--text);font-family:monospace;font-size:13px;border-radius:10px;padding:10px 14px;box-sizing:border-box;outline:none" />
    </label>

    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button id="endpoint-cancel-btn" type="button"
        style="background:0 0;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">
        Cancel
      </button>
      <button id="endpoint-save-btn" type="button"
        style="background:var(--text);color:var(--bg);border:0;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">
        Save and test
      </button>
    </div>
  </div>
</div>
