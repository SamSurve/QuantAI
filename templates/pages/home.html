{% extends "base.html" %}

{% block title %}QuantAI — Analyst's Ledger{% endblock %}

{% block content %}
<main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
  <div class="max-w-2xl mx-auto space-y-6">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-900">
      <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
      QuantAI Research Terminal
    </div>
    <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-slate-900 dark:text-white">
      Analyst's Ledger
    </h1>
    <p class="text-base sm:text-lg text-slate-600 dark:text-slate-400 max-w-xl mx-auto leading-relaxed">
      Focused financial research desk providing deterministic market data, company intelligence, and AI-synthesized executive briefs.
    </p>
    <div class="pt-4">
      <div id="search-container" class="w-full max-w-md mx-auto">
        <form id="search-form" action="/research" method="GET" class="relative">
          <input
            type="text"
            name="query"
            placeholder="Search company or ticker (e.g. AAPL, MSFT, NVDA)..."
            class="w-full px-5 py-3.5 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-zinc-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition"
            autocomplete="off"
          />
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
