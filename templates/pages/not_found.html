{% extends "base.html" %}

{% block title %}404 — Page Not Found | QuantAI{% endblock %}

{% block content %}
<div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-100 dark:from-zinc-950 dark:to-black">
  <div class="w-full max-w-lg mx-4 p-8 text-center bg-white/80 dark:bg-zinc-900/80 backdrop-blur-sm rounded-2xl shadow-lg border border-slate-200 dark:border-zinc-800">
    <div class="flex justify-center mb-6">
      <div class="relative w-16 h-16 flex items-center justify-center">
        <div class="absolute inset-0 bg-red-100 dark:bg-red-950/50 rounded-full animate-pulse"></div>
        <svg class="relative w-8 h-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
    </div>

    <h1 class="text-4xl font-bold text-slate-900 dark:text-white mb-2">404</h1>
    <h2 class="text-xl font-semibold text-slate-700 dark:text-slate-300 mb-4">Page Not Found</h2>
    <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
      Sorry, the page you are looking for doesn't exist.<br />
      It may have been moved or deleted.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a
        href="/"
        class="inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition shadow-md hover:shadow-lg"
      >
        <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Go Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
