<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>{% block title %}QuantAI — Analyst's Ledger{% endblock %}</title>
    <meta name="description" content="A focused financial research desk powered by the QuantAI Finance Agent." />
    <link rel="icon" type="image/png" href="/static/assets/analysts-ledger-logo.png" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem("quantai-theme") || "system";
          var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
    {% block head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
    <div id="app" class="flex min-h-screen flex-col">
      {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
