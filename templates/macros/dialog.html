{# Reusable Apple-style Dialog/Modal Macro #}
{% macro render(id, title, content, max_width="max-w-lg", class="") %}
<dialog id="{{ id }}" class="backdrop:bg-black/50 backdrop:backdrop-blur-sm bg-transparent p-0 border-0 m-auto {{ class }}">
  <div class="card p-7 {{ max_width }} w-[calc(100vw-2rem)] shadow-2xl border border-[var(--line)]">
    <div class="row mb-4">
      <h3 class="h2 text-[20px]">{{ title }}</h3>
      <button type="button" onclick="document.getElementById('{{ id }}').close()" class="seg p-1.5 hover:opacity-80" aria-label="Close dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="dialog-body text-[var(--text)] text-sm">
      {{ content }}
    </div>
  </div>
</dialog>
{% endmacro %}
