[project]
name = "quantai"
version = "1.0.0"
description = "Financial research terminal with Agno AgentOS and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.9.0",
    "groq>=0.32.0",
    "openai>=1.0.0",
    "yfinance>=1.0.0",
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
